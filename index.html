<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
    body{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        background-color: #f2f2f2;
    }

    .battery-box{
        border: 4px solid #00b9f5;
        width: 300px;
        height: 50px;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .battery-level{
        height: 100%;
        background-color: #00b9f5;
        width: 0%;
        transition: width 0.5s ease;
    }

    .battery-tip{
        width: 10px;
        height: 30px;
        background-color: #00b9f5;
        position: absolute;
        top: 10px;
        right: -14px;
        border-radius: 2px;
    }

    .battery-info{
        font-size: 20px;
        color: #333;
    }
</style>
</head>
<body>
    <h2> <i class="fa-solid fa-battery-full"></i> Battery Level Check</h2>

    <div class="battery-box">
        <div class="battery-level" id="level"></div>
        <div class="battery-tip"></div>
    </div>

    <div class="battery-info" id="info">
        Checking battery status...</div>


        <script>
            navigator.getBattery().then(function(battery){
                function updateBattery(){
                    const level = Math.floor
                    (battery.level * 100);
                    document.getElementById
                    ('level').style.width = level + '%';
                    document.getElementById('info').innerText = `Battery Level: ${level}%
                    ${battery.charging ? " Charging" : ""}`;
                }

                updateBattery();

                battery.addEventLinstener('levelchange',updateBattery);
                battery.addEventLinstener('chargingchange', updateBattery);
            });
        </script>

</body>
</html>
